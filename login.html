<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Raízes do Nordeste</title>

    <link rel="icon" href="./assets/logo.png" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body class="auth-page">

    <!-- HEADER -->
    <header class="auth-header">
        <a href="./index.html" class="auth-back">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>

        <a href="./index.html" class="auth-brand">
            <span class="logo-circle">RN</span>
            <span>Raízes do Nordeste</span>
        </a>
    </header>

    <!-- CONTEÚDO -->
    <main class="auth-main">

        <section class="auth-card">

            <div class="text-center mb-4">
                <img src="./assets/logo.png" alt="Logo" class="auth-logo">
                <h1 class="auth-title">Entrar</h1>
                <p class="auth-subtitle">Acesse sua conta para continuar.</p>
            </div>

            <form id="formLogin">

                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" id="loginEmail" class="form-control form-control-lg"
                        placeholder="seuemail@email.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input type="password" id="loginSenha" class="form-control form-control-lg"
                        placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">
                    Entrar
                </button>

                <p class="text-center mt-4 mb-0 auth-footer-text">
                    Não tem conta?
                    <a href="./cadastro.html" class="auth-link fw-semibold">Cadastrar</a>
                </p>

            </form>

        </section>

    </main>

    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
