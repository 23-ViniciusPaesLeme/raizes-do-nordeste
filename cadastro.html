<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro - Raízes do Nordeste</title>

  <link rel="icon" href="./assets/logo.png" type="image/png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body class="auth-page">

  <!-- HEADER -->
  <header class="auth-header">
    <a href="./index.html" class="auth-back">
      <i class="fas fa-arrow-left"></i> Voltar
    </a>

    <a href="./index.html" class="auth-brand">
      <span class="logo-circle">RN</span>
      <span>Raízes do Nordeste</span>
    </a>
  </header>

  <!-- CONTEÚDO -->
  <main class="auth-main">

    <section class="auth-card">

      <div class="text-center mb-4">
        <img src="./assets/logo.png" alt="Logo" class="auth-logo">
        <h1 class="auth-title">Criar conta</h1>
        <p class="auth-subtitle">
          Cadastre-se para fazer pedidos e acumular pontos no programa de fidelidade.
        </p>
      </div>

      <form id="formCadastro">

        <div class="mb-3">
          <label class="form-label">Nome completo</label>
          <input type="text" id="nome" class="form-control form-control-lg" placeholder="Seu nome completo" required>
        </div>

        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" id="email" class="form-control form-control-lg" placeholder="seuemail@email.com" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" id="senha" class="form-control form-control-lg" placeholder="Mínimo de 6 caracteres"
            required>
        </div>

        <div class="mb-3">
          <label class="form-label">Confirmar senha</label>
          <input type="password" id="confirmarSenha" class="form-control form-control-lg" placeholder="Repita sua senha"
            required>
        </div>

        <!-- LGPD -->
        <div class="form-check mb-4">
          <input type="checkbox" class="form-check-input" id="aceiteLgpd" required>
          <label class="form-check-label small" for="aceiteLgpd">
            Li e aceito o uso dos meus dados para cadastro, pedidos e programa de fidelidade,
            conforme a <a href="./lgpd.html">política de privacidade</a>.
          </label>
        </div>

        <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">
          Cadastrar
        </button>

        <p class="text-center mt-4 mb-0 auth-footer-text">
          Já tem conta?
          <a href="./login.html" class="auth-link fw-semibold">Entrar</a>
        </p>

      </form>

    </section>

  </main>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/main.js"></script>
</body>

</html>
